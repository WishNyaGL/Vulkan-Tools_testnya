name: Build Android VkCube via CMake

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: true

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Ninja
      run: sudo apt-get update && sudo apt-get install -y ninja-build

    - name: Find Android NDK and Build Tools
      id: find-paths
      run: |
        NDK_PATH=$(ls -d $ANDROID_HOME/ndk/* | tail -n 1)
        echo "ndk_path=$NDK_PATH" >> $GITHUB_OUTPUT
        
        BUILD_TOOLS_PATH=$(ls -d $ANDROID_HOME/build-tools/* | tail -n 1)
        echo "build_tools_path=$BUILD_TOOLS_PATH" >> $GITHUB_OUTPUT

    - name: Build VkCube APK via Official Script
      run: |
        sudo mkdir -p /platforms/android-26
        
        ANY_JAR=$(find $ANDROID_HOME/platforms/ -name "android.jar" | head -n 1)
        echo "Using base jar from: $ANY_JAR"
        
        sudo cp "$ANY_JAR" /platforms/android-26/android.jar
        
        export PATH="${{ steps.find-paths.outputs.build_tools_path }}:$PATH"
        
        python3 scripts/android.py --config Release --app-abi 'arm64-v8a' --app-stl c++_shared --apk
      env:
        ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}
        ANDROID_NDK_HOME: ${{ steps.find-paths.outputs.ndk_path }}

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: vkcube-apk
        path: build-android/bin/*.apk
